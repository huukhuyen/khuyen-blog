<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/logo.ico" />
    <!--seo:start-->
    <title>Nguyễn Hữu Khuyên</title>
    <meta
      name="description"
      content="Nhật ký cá nhân của Nguyễn Hữu Khuyên - Frontend Developer đến từ Đà Nẵng. Chuyện cuộc sống, chia sẻ lập trình và những điều đáng nhớ."
    />
    <!--seo:end-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,500&family=Inter+Tight:opsz,wght@14..32,400;14..32,500;14..32,600&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    />
    <script>
      // Đặt theme trước khi React mount để không nháy giao diện sáng khi đang ở dark.
      // Mặc định luôn là light, chỉ đổi khi người dùng tự toggle (key: src/lib/theme.ts).
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("site-theme") === "dark") theme = "dark";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
